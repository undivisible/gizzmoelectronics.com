[build]
  command = "bun install --frozen-lockfile && bun run build"
  publish = "build"

[build.environment]
  BUN_VERSION = "1.2.18"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*.(css|js)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
